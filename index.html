<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* Rating Section */
        .rating-section {
            margin-bottom: 30px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .star {
            width: 50px;
            height: 50px;
            font-size: 32px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: transform 0.2s, filter 0.2s;
            color: #ddd;
        }

        .star:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.5));
        }

        .star.active {
            color: #ffd700;
        }

        /* Thank You Section */
        .thank-you-section {
            display: none;
        }

        .thank-you-section.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .thank-you-message {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .review-button.google {
            background: #4285f4;
            color: white;
        }

        .review-button.google:hover {
            background: #357ae8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
        }

        .review-button.airbnb {
            background: #ff5a5f;
            color: white;
        }

        .review-button.airbnb:hover {
            background: #e74c51;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 90, 95, 0.4);
        }

        .review-button.vrbo {
            background: #003580;
            color: white;
        }

        .review-button.vrbo:hover {
            background: #002c5f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 53, 128, 0.4);
        }

        /* Feedback Section */
        .feedback-section {
            display: none;
        }

        .feedback-section.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .feedback-prompt {
            color: #333;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .submit-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            display: none;
            color: #d32f2f;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 10px;
            background: #ffebee;
            border-radius: 8px;
        }

        .success-message {
            display: none;
            color: #388e3c;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .stars {
                gap: 8px;
            }

            .star {
                width: 44px;
                height: 44px;
                font-size: 28px;
            }

            .button-group {
                gap: 10px;
            }

            .review-button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>How was your stay?</h1>
        <p class="subtitle">We'd love to hear from you</p>

        <div class="rating-section">
            <div class="stars">
                <button class="star" data-rating="1">★</button>
                <button class="star" data-rating="2">★</button>
                <button class="star" data-rating="3">★</button>
                <button class="star" data-rating="4">★</button>
                <button class="star" data-rating="5">★</button>
            </div>
        </div>

        <div class="thank-you-section" id="thankYouSection">
            <div class="thank-you-message">
                Thank you for your amazing feedback! Help others discover this property:
            </div>
            <div class="button-group">
                <a href="https://www.google.com/maps" class="review-button google" target="_blank">Google Reviews</a>
                <a href="https://www.airbnb.com" class="review-button airbnb" target="_blank">Airbnb</a>
                <a href="https://www.vrbo.com" class="review-button vrbo" target="_blank">VRBO</a>
            </div>
        </div>

        <div class="feedback-section" id="feedbackSection">
            <div class="feedback-prompt">
                We're sorry to hear that. Help us improve your experience:
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage">Thank you! Your feedback has been received.</div>
            <div class="form-group">
                <label for="feedback">What could we do better?</label>
                <textarea id="feedback" placeholder="Please share your thoughts..." required></textarea>
            </div>
            <button class="submit-button" id="submitButton">Submit Feedback</button>
        </div>
    </div>

    <script>
        const stars = document.querySelectorAll('.star');
        const thankYouSection = document.getElementById('thankYouSection');
        const feedbackSection = document.getElementById('feedbackSection');
        const submitButton = document.getElementById('submitButton');
        const feedbackTextarea = document.getElementById('feedback');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        let selectedRating = 0;

        // Handle star clicks
        stars.forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);

                // Update visual state
                stars.forEach(s => {
                    if (parseInt(s.dataset.rating) <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });

                // Show appropriate section
                if (selectedRating >= 4) {
                    feedbackSection.classList.remove('show');
                    thankYouSection.classList.add('show');
                } else {
                    thankYouSection.classList.remove('show');
                    feedbackSection.classList.add('show');
                    feedbackTextarea.focus();
                }

                errorMessage.style.display = 'none';
                successMessage.classList.remove('show');
            });
        });

        // Handle feedback submission
        submitButton.addEventListener('click', async () => {
            const feedback = feedbackTextarea.value.trim();

            if (!feedback) {
                errorMessage.textContent = 'Please enter your feedback before submitting.';
                errorMessage.style.display = 'block';
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            errorMessage.style.display = 'none';

            try {
                // Get webhook URL from:
                // 1. URL query parameter: ?webhook=YOUR_URL
                // 2. Or replace WEBHOOK_URL_PLACEHOLDER below
                const params = new URLSearchParams(window.location.search);
                const webhookUrl = params.get('webhook') || 'WEBHOOK_URL_PLACEHOLDER';

                if (webhookUrl === 'WEBHOOK_URL_PLACEHOLDER') {
                    throw new Error('Webhook URL not configured. Add ?webhook=YOUR_URL to the URL or update WEBHOOK_URL_PLACEHOLDER in the HTML.');
                }

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        rating: selectedRating,
                        feedback: feedback,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit feedback');
                }

                successMessage.classList.add('show');
                feedbackTextarea.value = '';

                // Reset after 3 seconds
                setTimeout(() => {
                    feedbackSection.classList.remove('show');
                    thankYouSection.classList.remove('show');
                    successMessage.classList.remove('show');
                    stars.forEach(s => s.classList.remove('active'));
                    selectedRating = 0;
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Feedback';
                }, 3000);
            } catch (error) {
                errorMessage.textContent = 'Error submitting feedback. Please try again.';
                errorMessage.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Feedback';
            }
        });

        // Allow Enter key to submit (but not within textarea)
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey && feedbackSection.classList.contains('show')) {
                submitButton.click();
            }
        });
    </script>
</body>
</html>
