<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Tropical subtle background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 193, 7, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(76, 175, 80, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .page-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            max-width: 520px;
            width: 100%;
        }

        .hero {
            padding: 50px 40px 30px;
            text-align: center;
            position: relative;
        }

        /* Dynamic hero background based on property */
        body.villa .hero {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        body.casa .hero {
            background: linear-gradient(135deg, #d4a574 0%, #c99156 100%);
        }

        .property-name {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .content {
            padding: 40px 40px;
        }

        .rating-prompt {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* Star Rating Card */
        .rating-card {
            background: #f8fafb;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 30px;
            border: 2px solid #f0f3f7;
            transition: all 0.3s ease;
        }

        .rating-card:hover {
            border-color: #e0e6f0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .star {
            width: 56px;
            height: 56px;
            font-size: 36px;
            cursor: pointer;
            background: white;
            border: 2px solid #e8eef5;
            border-radius: 12px;
            padding: 0;
            transition: all 0.2s ease;
            color: #cbd5e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
        }

        .star:hover {
            transform: translateY(-4px);
            border-color: #ffd700;
            background: #fffbf0;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.25);
        }

        .star.active {
            color: #ffd700;
            background: #fffbf0;
            border-color: #ffd700;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .rating-label {
            font-size: 13px;
            color: #7d8fa3;
            text-align: center;
            font-weight: 500;
        }

        /* Thank You Section */
        .thank-you-section {
            display: none;
        }

        .thank-you-section.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .thank-you-message {
            font-size: 17px;
            color: #2c3e50;
            margin-bottom: 28px;
            line-height: 1.6;
            font-weight: 500;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-button {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .review-button.google {
            background: #4285f4;
            color: white;
        }

        .review-button.google:hover {
            background: #357ae8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(66, 133, 244, 0.35);
        }

        .review-button.airbnb {
            background: #ff5a5f;
            color: white;
        }

        .review-button.airbnb:hover {
            background: #e74c51;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 90, 95, 0.35);
        }

        .review-button.vrbo {
            background: #003580;
            color: white;
        }

        .review-button.vrbo:hover {
            background: #002c5f;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 53, 128, 0.35);
        }

        .review-button.hidden {
            display: none;
        }

        /* Feedback Section */
        .feedback-section {
            display: none;
        }

        .feedback-section.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .feedback-prompt {
            color: #2c3e50;
            margin-bottom: 24px;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e8eef5;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s;
            background: #f8fafb;
            color: #2c3e50;
        }

        textarea::placeholder {
            color: #a0aec0;
        }

        textarea:focus {
            outline: none;
            border-color: #cbd5e0;
            background: white;
            box-shadow: 0 0 0 3px rgba(203, 213, 224, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            letter-spacing: 0.3px;
        }

        body.villa .submit-button {
            background: #1e3c72;
        }

        body.villa .submit-button:hover {
            background: #152849;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(30, 60, 114, 0.35);
        }

        body.casa .submit-button {
            background: #c99156;
        }

        body.casa .submit-button:hover {
            background: #b37f45;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201, 145, 86, 0.35);
        }

        .submit-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            display: none;
            color: #c53030;
            font-size: 13px;
            margin-bottom: 15px;
            padding: 12px;
            background: #fed7d7;
            border-radius: 8px;
            border-left: 4px solid #c53030;
        }

        .success-message {
            display: none;
            color: #22543d;
            font-size: 13px;
            margin-bottom: 15px;
            padding: 12px;
            background: #c6f6d5;
            border-radius: 8px;
            border-left: 4px solid #22543d;
            animation: slideIn 0.3s ease-out;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 16px;
                margin: 20px;
            }

            .hero {
                padding: 40px 28px 24px;
            }

            .property-name {
                font-size: 28px;
                margin-bottom: 6px;
            }

            .tagline {
                font-size: 15px;
            }

            .content {
                padding: 30px 28px;
            }

            .rating-prompt {
                font-size: 16px;
                margin-bottom: 24px;
            }

            .rating-card {
                padding: 24px 16px;
                margin-bottom: 24px;
            }

            .stars {
                gap: 12px;
            }

            .star {
                width: 50px;
                height: 50px;
                font-size: 32px;
                border-radius: 10px;
            }

            .button-group {
                gap: 10px;
            }

            .review-button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .thank-you-message {
                font-size: 16px;
                margin-bottom: 20px;
            }

            label {
                font-size: 13px;
                margin-bottom: 8px;
            }

            textarea {
                padding: 12px;
                font-size: 14px;
                min-height: 100px;
            }

            .submit-button {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <div class="hero">
                <h1 class="property-name" id="propertyName">Villa Ranguana</h1>
                <p class="tagline">Thank you for staying with us</p>
            </div>

            <div class="content">
                <p class="rating-prompt">How was your stay?</p>

                <div class="rating-card">
                    <div class="stars">
                        <button class="star" data-rating="1" title="Poor">★</button>
                        <button class="star" data-rating="2" title="Fair">★</button>
                        <button class="star" data-rating="3" title="Good">★</button>
                        <button class="star" data-rating="4" title="Very Good">★</button>
                        <button class="star" data-rating="5" title="Excellent">★</button>
                    </div>
                    <p class="rating-label">Click a star to rate</p>
                </div>

                <div class="thank-you-section" id="thankYouSection">
                    <div class="thank-you-message">
                        Thank you for your amazing feedback! Help other guests discover us:
                    </div>
                    <div class="button-group">
                        <a class="review-button google" id="googleButton" href="#" target="_blank">Google Reviews</a>
                        <a class="review-button airbnb" id="airbnbButton" href="#" target="_blank">Airbnb</a>
                        <a class="review-button vrbo" id="vrboButton" href="#" target="_blank">VRBO</a>
                    </div>
                </div>

                <div class="feedback-section" id="feedbackSection">
                    <div class="feedback-prompt">
                        We're sorry to hear that. Help us improve your experience:
                    </div>
                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage">Thank you! Your feedback has been received.</div>
                    <div class="form-group">
                        <label for="feedback">What could we improve?</label>
                        <textarea id="feedback" placeholder="Please share your thoughts..." required></textarea>
                    </div>
                    <button class="submit-button" id="submitButton">Submit Feedback</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Property configuration
        const properties = {
            villa: {
                name: 'Villa Ranguana',
                reviews: {
                    google: 'https://www.google.com/search?si=AL3DRZEsmMGCryMMFSHJ3StBhOdZ2-6yYkXd_doETEE1OR-qObjDYQr2UY-11uf-cK9HtBUrmHEhofwXypuaOUWEyoEd4EkDOuzVmk2-WvoZ86vyG0OYuKAp-e4yqQo2tgmpaPgckfv6&q=Villa+Ranguana+Reviews',
                    airbnb: 'https://www.airbnb.com/rooms/38763025',
                    vrbo: 'https://www.vrbo.com/1779764'
                }
            },
            casa: {
                name: 'Casa Ranguana',
                reviews: {
                    airbnb: 'https://www.airbnb.com/rooms/1191331380306324345',
                    vrbo: 'https://www.vrbo.com/3025760'
                }
            }
        };

        // Initialize
        function initPage() {
            const params = new URLSearchParams(window.location.search);
            const property = params.get('property') || 'villa';
            const config = properties[property] || properties.villa;

            // Set theme
            document.body.className = property;
            document.getElementById('propertyName').textContent = config.name;

            // Set review links
            const googleBtn = document.getElementById('googleButton');
            const airbnbBtn = document.getElementById('airbnbButton');
            const vrboBtn = document.getElementById('vrboButton');

            googleBtn.href = config.reviews.google || '#';
            if (!config.reviews.google) {
                googleBtn.classList.add('hidden');
            }

            airbnbBtn.href = config.reviews.airbnb || '#';
            vrboBtn.href = config.reviews.vrbo || '#';
        }

        const stars = document.querySelectorAll('.star');
        const thankYouSection = document.getElementById('thankYouSection');
        const feedbackSection = document.getElementById('feedbackSection');
        const submitButton = document.getElementById('submitButton');
        const feedbackTextarea = document.getElementById('feedback');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        let selectedRating = 0;

        // Handle star clicks
        stars.forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.rating);

                // Update visual state
                stars.forEach(s => {
                    if (parseInt(s.dataset.rating) <= selectedRating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });

                // Show appropriate section
                if (selectedRating >= 4) {
                    feedbackSection.classList.remove('show');
                    thankYouSection.classList.add('show');
                } else {
                    thankYouSection.classList.remove('show');
                    feedbackSection.classList.add('show');
                    feedbackTextarea.focus();
                }

                errorMessage.style.display = 'none';
                successMessage.classList.remove('show');
            });
        });

        // Handle feedback submission
        submitButton.addEventListener('click', async () => {
            const feedback = feedbackTextarea.value.trim();

            if (!feedback) {
                errorMessage.textContent = 'Please enter your feedback before submitting.';
                errorMessage.style.display = 'block';
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            errorMessage.style.display = 'none';

            try {
                const params = new URLSearchParams(window.location.search);
                const webhookUrl = params.get('webhook') || 'WEBHOOK_URL_PLACEHOLDER';
                const property = params.get('property') || 'villa';

                if (webhookUrl === 'WEBHOOK_URL_PLACEHOLDER') {
                    throw new Error('Webhook URL not configured. Add ?webhook=YOUR_URL to the URL.');
                }

                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        property: property,
                        rating: selectedRating,
                        feedback: feedback,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit feedback');
                }

                successMessage.classList.add('show');
                feedbackTextarea.value = '';

                // Reset after 3 seconds
                setTimeout(() => {
                    feedbackSection.classList.remove('show');
                    thankYouSection.classList.remove('show');
                    successMessage.classList.remove('show');
                    stars.forEach(s => s.classList.remove('active'));
                    selectedRating = 0;
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Feedback';
                }, 3000);
            } catch (error) {
                errorMessage.textContent = 'Error submitting feedback. Please try again.';
                errorMessage.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Feedback';
            }
        });

        // Allow Enter key to submit (but not within textarea)
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey && feedbackSection.classList.contains('show')) {
                submitButton.click();
            }
        });

        // Initialize on page load
        initPage();
    </script>
</body>
</html>
